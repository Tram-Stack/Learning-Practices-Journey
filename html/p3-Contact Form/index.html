<!DOCTYPE html>
<html>
    <head>
        <title>HTML Forms</title>
    </head>
    <body>
        <h1>Contact Me</h1>
        <p>Please fill out the form below and I'll get back to you soon</p>
        <form>
            <label for="Name">Name</label><br>
            <input type="text" id="Name" placeholder="La Thi Bao Tram"><br><br>
        
            <label for="Email">Email</label><br>
            <input type="text" id="Email" placeholder="lsbsotram@gmail.com"><br><br>
        
            <label for="Message">Message</label><br>
            <textarea type="message" id="Message" style="width: 400px; height: 150px";></textarea> <br><br>
        
        </form>
        <button type="submit">Send Message</button><br><br>
        <p> &copy 2026 BaoTram</p>
    </body>
</html>
